<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host File Browser</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-folder-tree text-indigo-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">Host File Browser</h1>
        </div>
        <div>
            <button id="select-dir-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center space-x-2">
                <i class="fa-solid fa-folder-open"></i>
                <span>Select Host Folder</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col">

        <!-- Breadcrumbs & Path Info -->
        <div class="bg-slate-800 border border-slate-700 rounded-t-xl px-4 py-3 flex items-center justify-between">
            <div id="breadcrumb-container" class="flex items-center space-x-2 text-sm text-slate-300 overflow-x-auto whitespace-nowrap">
                <span class="text-slate-500 italic">No folder selected. Click "Select Host Folder" above.</span>
            </div>
            <div id="file-count" class="text-xs text-slate-400">0 items</div>
        </div>

        <!-- File Table -->
        <div class="bg-slate-800/50 border-x border-b border-slate-700 rounded-b-xl flex-1 overflow-hidden flex flex-col shadow-inner">
            <div class="overflow-y-auto flex-1 max-h-[65vh]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 sticky top-0 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                        <tr>
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3 px-4 w-32">Type</th>
                            <th class="py-3 px-4 w-32 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="file-list" class="divide-y divide-slate-700/50 text-sm">
                        <tr>
                            <td colspan="3" class="py-12 text-center text-slate-500">
                                <i class="fa-solid fa-box-open text-4xl mb-3 block"></i>
                                Ready to browse. Select a directory to view its contents.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- File Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between bg-slate-800/80">
                <h3 id="modal-title" class="font-semibold text-slate-200 truncate">File Preview</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 font-mono text-xs text-slate-300 bg-slate-900/50">
                <!-- Preview content injected here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentDirectoryHandle = null;
        let directoryHistory = []; // Stack to track navigation path handles

        const selectDirBtn = document.getElementById('select-dir-btn');
        const fileListEl = document.getElementById('file-list');
        const breadcrumbContainer = document.getElementById('breadcrumb-container');
        const fileCountEl = document.getElementById('file-count');
        const previewModal = document.getElementById('preview-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');

        // Check if browser supports File System Access API
        if (!window.showDirectoryPicker) {
            alert('Your browser does not support the File System Access API. Please use Google Chrome, Microsoft Edge, or Opera.');
            selectDirBtn.disabled = true;
            selectDirBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        selectDirBtn.addEventListener('click', async () => {
            try {
                // Prompt user to select a folder on their host machine
                const handle = await window.showDirectoryPicker();
                directoryHistory = [ { name: handle.name, handle: handle } ];
                await loadDirectory(handle);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert('Error opening directory.');
                }
            }
        });

        async function loadDirectory(dirHandle) {
            currentDirectoryHandle = dirHandle;
            renderBreadcrumbs();
            
            fileListEl.innerHTML = '';
            let items = [];

            // Read entries from the directory handle
            for await (const entry of dirHandle.values()) {
                items.push(entry);
            }

            // Sort: Folders first, then files alphabetically
            items.sort((a, b) => {
                if (a.kind === b.kind) return a.name.localeCompare(b.name);
                return a.kind === 'directory' ? -1 : 1;
            });

            fileCountEl.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;

            if (items.length === 0) {
                fileListEl.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-12 text-center text-slate-500">
                            <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>
                            This folder is empty.
                        </td>
                    </tr>
                `;
                return;
            }

            for (const item of items) {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition group';

                const isDir = item.kind === 'directory';
                const iconClass = isDir ? 'fa-folder text-amber-400' : getFileIcon(item.name);

                tr.innerHTML = `
                    <td class="py-3 px-4 flex items-center space-x-3">
                        <i class="fa-solid ${iconClass} text-lg w-5"></i>
                        <span class="${isDir ? 'font-medium text-slate-200 cursor-pointer hover:underline' : 'text-slate-300'} truncate">
                            ${escapeHtml(item.name)}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-slate-400 text-xs uppercase">${isDir ? 'Directory' : 'File'}</td>
                    <td class="py-3 px-4 text-right space-x-2"></td>
                `;

                // Handle clicks on directories or files
                const nameSpan = tr.querySelector('span');
                const actionsTd = tr.querySelector('td:last-child');

                if (isDir) {
                    nameSpan.addEventListener('click', async () => {
                        directoryHistory.push({ name: item.name, handle: item });
                        await loadDirectory(item);
                    });
                } else {
                    // Action: View/Preview
                    const viewBtn = document.createElement('button');
                    viewBtn.className = 'bg-slate-700 hover:bg-indigo-600 text-slate-200 px-3 py-1 rounded text-xs transition';
                    viewBtn.innerHTML = '<i class="fa-solid fa-eye mr-1"></i> View';
                    viewBtn.addEventListener('click', () => previewFile(item));
                    actionsTd.appendChild(viewBtn);

                    // Action: Download
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'bg-slate-700 hover:bg-emerald-600 text-slate-200 px-3 py-1 rounded text-xs transition';
                    downloadBtn.innerHTML = '<i class="fa-solid fa-download mr-1"></i> Save';
                    downloadBtn.addEventListener('click', () => downloadFile(item));
                    actionsTd.appendChild(downloadBtn);
                }

                fileListEl.appendChild(tr);
            }
        }

        function renderBreadcrumbs() {
            breadcrumbContainer.innerHTML = '';
            
            directoryHistory.forEach((dirObj, index) => {
                if (index > 0) {
                    const separator = document.createElement('span');
                    separator.className = 'text-slate-600 mx-1';
                    separator.innerHTML = '<i class="fa-solid fa-chevron-right text-[10px]"></i>';
                    breadcrumbContainer.appendChild(separator);
                }

                const crumbBtn = document.createElement('button');
                crumbBtn.className = `hover:text-indigo-400 transition font-medium ${index === directoryHistory.length - 1 ? 'text-indigo-300 pointer-events-none' : ''}`;
                crumbBtn.textContent = dirObj.name;
                crumbBtn.addEventListener('click', async () => {
                    directoryHistory = directoryHistory.slice(0, index + 1);
                    await loadDirectory(dirObj.handle);
                });
                breadcrumbContainer.appendChild(crumbBtn);
            });
        }

        async function previewFile(fileHandle) {
            try {
                const file = await fileHandle.getFile();
                modalTitle.textContent = file.name;
                
                // Read text for preview
                const text = await file.text();
                modalBody.textContent = text;
                previewModal.classList.remove('hidden');
                previewModal.classList.add('flex');
            } catch (err) {
                console.error(err);
                alert('Could not read file content for preview.');
            }
        }

        async function downloadFile(fileHandle) {
            try {
                const file = await fileHandle.getFile();
                const url = URL.createObjectURL(file);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error(err);
                alert('Could not download file.');
            }
        }

        function closeModal() {
            previewModal.classList.remove('flex');
            previewModal.classList.add('hidden');
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                - return 'fa-file-lines text-blue-400';
                case 'js': case 'ts': case 'html': case 'css': case 'json': return 'fa-file-code text-yellow-400';
                case 'png': case 'jpg': case 'jpeg': case 'gif': case 'svg': return 'fa-file-image text-emerald-400';
                case 'pdf': return 'fa-file-pdf text-red-400';
                case 'zip': case 'rar': case 'tar': case 'gz': return 'fa-file-zipper text-purple-400';
                default: return 'fa-file text-slate-400';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
